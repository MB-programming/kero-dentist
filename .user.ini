; PHP Configuration for Dentist Booking Website
; This file is used if .htaccess PHP settings don't work

upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
display_errors = On
error_reporting = E_ALL
log_errors = On
error_log = error.log
